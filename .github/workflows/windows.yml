name: Windows Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 6 * * 1'  # every Monday 06:00 UTC — keeps vcpkg cache alive (7-day expiry)

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg installed packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-installed-x64-windows-static-v2
          restore-keys: vcpkg-installed-x64-windows-static-

      - name: Install dependencies via vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          vcpkg install --classic --triplet x64-windows-static `
            cairo lua cppunit `
            boost-algorithm boost-any boost-asio boost-assign boost-bimap boost-bind `
            boost-dynamic-bitset boost-flyweight boost-foreach boost-function `
            boost-geometry boost-graph boost-integer boost-interprocess boost-lambda `
            boost-locale boost-logic boost-ublas boost-regex boost-serialization `
            boost-signals2 boost-spirit boost-static-assert boost-system boost-thread `
            boost-timer boost-tuple boost-type-traits boost-unordered boost-utility `
            boost-uuid boost-smart-ptr
        shell: pwsh

      - name: Save vcpkg installed packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-installed-x64-windows-static-v2

      - name: Configure
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DVCPKG_MANIFEST_MODE=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DSAMBAG_VST_SUPPORT=OFF `
            -DSAMBAG_BUILD_TESTS=ON `
            -DSAMBAG_BUILD_TESTAPP=OFF `
            -DSAMBAG_USE_LOG=OFF `
            -DSAMBAG_STATIC_DEPS=ON
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release --parallel
        shell: pwsh

      - name: Run tests
        working-directory: ${{ github.workspace }}
        run: .\build\src\Release\unit_tests.exe
        shell: pwsh

      - name: Install (cmake --install)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: cmake --install build --config Release --prefix dist
        shell: pwsh

      - name: Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: Compress-Archive -Path dist\* -DestinationPath sambag-windows-x64-static.zip
        shell: pwsh

      - name: Publish prebuilt release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view prebuilt-latest 2>$null `
            || gh release create prebuilt-latest `
                 --title "Prebuilt binaries (latest master)" `
                 --notes "Auto-generated prebuilt package — do not edit manually."
          gh release upload prebuilt-latest sambag-windows-x64-static.zip --clobber
        shell: pwsh
